work_with_me:
  button: Work with me
  question: How can I work with you?
  answers:
  - >-
    I am always looking for curious and motivated people to join our research at the intersection of computational social science, NLP, and online safety. If our work resonates with you, please reach out.
  - >-
    <b>PhD</b><br>I recruit PhD students through the <a href="https://web.inf.ed.ac.uk/cdt/responsible-nlp">CDT in Responsible Natural Language Processing</a> at the University of Edinburgh. The programme offers fully-funded four-year studentships with a strong cohort and training environment. If you are interested in pursuing a PhD with me, please apply through the CDT and mention my name in your application.
  - >-
    <b>Research Assistants</b><br>I occasionally have opportunities for masters and undergraduate research assistantships. If you are a University of Edinburgh student interested in getting hands-on research experience, feel free to contact me with a brief note about your background and interests.
  - >-
    I welcome self-sponsored in-person visitor students to the University of Edinburgh and our lab. <strong>We do not have funded internships for non University of Edinburgh students due to employment laws. We do not accommodate online internships.</strong>
  - >-
    <b>Masters &amp; Undergraduate Projects</b><br>University of Edinburgh masters and undergraduate students are very welcome to work on dissertation projects with me. For some weird reason, I get too many interests to my projects so cannot cope with emails. Please do not email to me about dissertation projects, I auto-accept everyone.
