- title: >-
    ChatGPT vs Teachers vs Students: Large-Scale Analysis of Generative AI Discourse in Education Communities on Reddit
  authors: Pelin Yüce, Xiangruo Dai, Rebecca Owens, Tuğrulcan Elmas
  year: 2027
  type: Full Paper
  venue: 21st International Conference On Web And Social Media ICWSM 2027
  venue_short: ICWSM 2027
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2605.17712
  tldr: >-
    Analysis of 270k Reddit posts shows AI-in-education discourse shifted from detection-evasion to enforcement — adversarial integrity disputes, mostly student-initiated, dominate the rare cross-role faculty-student contact
  abstract: >-
    Generative Artificial Intelligence (GenAI) has prompted significant discussion in education, yet large-scale empirical evidence on how students and teachers perceive and navigate this shift remains limited. We analyse 270k AI-related Reddit posts and comments from 26 education-related subreddits spanning higher education, K-12 teaching, and professional training between November 2022 and April 2026. Topic modelling reveals seventeen themes covering academic integrity, teaching & pedagogy, career anxiety, policy, and niche professional contexts. Discourse evolves from an early detection-and-evasion arms race into a sustained enforcement regime that constructive integration only begins to challenge in mid-2024. Stakeholder communities differ sharply: K-12 teachers foreground cognitive dependency, academics focus on AI detection and deliberation, and professional-programme students concentrate on career anxiety. Sentiment correlates strongly negatively with engagement, showing adversarial
    enforcement themes mobilise communities far more than constructive integration discourse. Examining where faculty and students meet, we find 17% of threads are cross-role, and one third of such contact occurs in the adversarial themes AI Detection and Misconduct Enforcement. Students initiate 68% of mixed threads, but faculty produce most cross-role replies. Mixed threads contain 2-3 times more records and last 2-4 times longer than same-role threads, making adversarial integrity disputes the center of sustained faculty-student contact. We discuss implications for governance, pedagogical design, and cross-role contact design. The code and data is available
