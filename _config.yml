title: Tuğrulcan Elmas                # your name, exactly as it appears in author lists (it gets bolded)
position: Assistant Professor
affiliation: University of Edinburgh
description: >-
  Tuğrulcan Elmas, Assistant Professor at the University of Edinburgh, working on AI & social media:
  detecting fake / AI-generated content, human–AI dialogue, and automating science and education.

url: "https://tugrulcan.com"          # where the site lives (used for link previews)
